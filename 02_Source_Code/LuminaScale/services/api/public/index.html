<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LuminaScale Operations</title>
  <style>
    :root { color-scheme: dark; --bg:#08111d; --panel:#111f31; --line:#263a52; --blue:#59a7ff; --green:#63d69b; --text:#eef6ff; --muted:#99abc1; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.45 Inter,Segoe UI,sans-serif; background:radial-gradient(circle at top right,#15345a 0,#08111d 40%); color:var(--text); min-height:100vh; }
    main { max-width:1180px; margin:auto; padding:42px 24px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:24px; }
    h1 { margin:0; font-size:34px; letter-spacing:-.03em; } h2 { font-size:18px; margin:0 0 14px; }
    .eyebrow { color:var(--blue); text-transform:uppercase; font-size:12px; letter-spacing:.16em; font-weight:700; }
    .muted { color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .card { background:linear-gradient(145deg,rgba(20,37,58,.95),rgba(12,25,41,.95)); border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:0 18px 45px rgba(0,0,0,.22); }
    .metric { font-size:32px; font-weight:750; margin-top:6px; } .metric small { font-size:13px; color:var(--muted); font-weight:500; }
    .wide { grid-column:span 2; } form { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:10px; }
    input,button { border-radius:9px; border:1px solid var(--line); padding:11px 12px; font:inherit; }
    input { background:#0b1726; color:var(--text); } button { background:var(--blue); color:#061221; font-weight:750; cursor:pointer; border:0; }
    table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); font-size:13px; } th { color:var(--muted); }
    .status { display:inline-flex; align-items:center; gap:7px; color:var(--green); }.dot { width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green); }
    #message { min-height:22px; margin-top:10px; color:var(--muted); }
    @media(max-width:800px){ .grid{grid-template-columns:1fr}.wide{grid-column:auto}form{grid-template-columns:1fr}header{align-items:start;flex-direction:column} }
  </style>
</head>
<body>
<main>
  <header>
    <div><div class="eyebrow">Smart lighting operations</div><h1>LuminaScale</h1><div class="muted">Live prototype telemetry and manual control</div></div>
    <div class="status"><span class="dot"></span><span id="connection">Connecting</span></div>
  </header>
  <section class="grid">
    <article class="card"><div class="muted">Active devices</div><div class="metric" id="devices">-</div></article>
    <article class="card"><div class="muted">Processed events</div><div class="metric" id="events">-</div></article>
    <article class="card"><div class="muted">Active rules</div><div class="metric" id="rules">-</div></article>
    <article class="card wide">
      <h2>Recent apartment state</h2>
      <div style="overflow:auto"><table><thead><tr><th>Building</th><th>Apartment</th><th>Lux</th><th>Occupied</th><th>Brightness</th><th>Updated</th></tr></thead><tbody id="states"></tbody></table></div>
    </article>
    <article class="card">
      <h2>Manual brightness command</h2>
      <form id="command"><input name="buildingId" placeholder="Building ID" value="building-1" required><input name="apartmentId" placeholder="Apartment ID" value="apt-1" required><input name="brightness" type="number" min="0" max="100" value="60" required><button>Send</button></form>
      <div id="message"></div>
    </article>
  </section>
</main>
<script>
  const apiKey = new URLSearchParams(location.search).get('apiKey') || 'local-demo-key';
  const headers = {'x-api-key': apiKey, 'content-type':'application/json'};
  const esc = value => String(value ?? '-').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function refresh(){
    try {
      const response = await fetch('/api/summary', {headers});
      if(!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      devices.textContent=data.devices; events.textContent=data.events; rules.textContent=data.activeRules;
      states.innerHTML=data.recent.map(s=>`<tr><td>${esc(s.buildingId)}</td><td>${esc(s.apartmentId)}</td><td>${esc(s.filteredLux ?? s.lastLux)}</td><td>${s.occupied?'Yes':'No'}</td><td>${esc(s.brightness ?? s.lastCommand?.brightness)}</td><td>${s.updatedAt?new Date(s.updatedAt).toLocaleTimeString():'-'}</td></tr>`).join('');
      connection.textContent='Connected';
    } catch(error){ connection.textContent=`Unavailable: ${error.message}`; }
  }
  command.addEventListener('submit', async event=>{
    event.preventDefault(); const values=Object.fromEntries(new FormData(command)); values.brightness=Number(values.brightness);
    const response=await fetch('/api/commands',{method:'POST',headers,body:JSON.stringify(values)}); const data=await response.json();
    message.textContent=response.ok?`Command queued: ${data.command.commandId}`:(data.error||'Command failed');
  });
  refresh(); setInterval(refresh,3000);
</script>
</body>
</html>
